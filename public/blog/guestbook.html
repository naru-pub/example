<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>방명록 · 작은 기록</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="guestbook">
    <header>
      <a class="brand" href="./index.html">작은 기록</a>
      <nav aria-label="메뉴">
        <a href="./index.html">글</a
        ><a href="./guestbook.html" aria-current="page">방명록</a
        ><a href="./admin.html">쓰기</a>
      </nav>
    </header>
    <main>
      <h1>방명록</h1>
      <form id="entry-form" class="card">
        <label for="name">이름</label>
        <input id="name" required maxlength="60" autocomplete="nickname" />
        <label for="message">한마디</label>
        <textarea id="message" required maxlength="2000" rows="4"></textarea>
        <button id="submit">남기기</button>
      </form>
      <p class="hint">
        남긴 글은 누구나 볼 수 있고, 고치거나 지울 수 없습니다.
      </p>
      <div id="entries"></div>
      <button id="more" class="secondary" hidden>더 보기</button>
      <p id="status" role="status" aria-live="polite">불러오는 중…</p>
    </main>
    <footer>
      <a href="https://naru.pub/docs/database">나루</a>로 만든 예제입니다.
    </footer>
    <script type="module" src="./list.js"></script>
  </body>
</html>
