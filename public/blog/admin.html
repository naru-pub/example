<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>쓰기 · 작은 기록</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="admin">
    <header>
      <a class="brand" href="./index.html">작은 기록</a>
      <nav aria-label="메뉴">
        <a href="./index.html">글</a><a href="./guestbook.html">방명록</a
        ><a href="./admin.html" aria-current="page">쓰기</a>
      </nav>
    </header>
    <main>
      <h1>쓰기</h1>
      <div class="toolbar">
        <p id="auth">확인 중…</p>
        <button id="login" type="button">나루로 로그인</button>
        <button id="logout" type="button" class="secondary" hidden>
          로그아웃
        </button>
      </div>
      <p id="editing" class="meta">새 글</p>
      <form id="post-form" class="card">
        <label for="title">제목</label>
        <input id="title" required maxlength="160" />
        <label for="body">본문</label>
        <textarea id="body" required maxlength="12000" rows="14"></textarea>
        <label for="category">분류</label>
        <input id="category" maxlength="60" placeholder="예: 일상" />
        <button id="publish" disabled>공개</button>
        <button id="save-draft" type="button" class="secondary" disabled>
          초안 저장
        </button>
        <button id="new-post" type="button" class="secondary">새 글</button>
        <button id="delete-post" type="button" class="danger" disabled>
          삭제
        </button>
      </form>
      <a id="view-post" hidden>글 보기 →</a>
      <section class="card" aria-labelledby="manage-heading">
        <h2 id="manage-heading">저장한 글</h2>
        <label for="manage-kind">종류</label>
        <select id="manage-kind">
          <option value="posts">공개한 글</option>
          <option value="drafts">초안</option>
        </select>
        <button id="reload-list" type="button" disabled>불러오기</button>
        <fieldset id="manage-list" disabled></fieldset>
        <button id="manage-more" type="button" class="secondary" hidden>
          더 보기
        </button>
      </section>
      <p id="status" role="status" aria-live="polite">불러오는 중…</p>
    </main>
    <footer>
      <a href="https://naru.pub/docs/database">나루</a>로 만든 예제입니다.
    </footer>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
