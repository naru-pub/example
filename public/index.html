<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나루 예제</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #000;
        font:
          18px/1.7 system-ui,
          -apple-system,
          "Apple SD Gothic Neo",
          sans-serif;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 {
        margin: 0 0 48px;
        font-size: clamp(48px, 11vw, 104px);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 4px solid #000;
      }
      li {
        border-bottom: 2px solid #000;
      }
      a {
        display: block;
        padding: 24px 0;
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        background: #000;
        color: #fff;
      }
      strong {
        display: block;
        font-size: 26px;
        font-weight: 900;
      }
      span {
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>나루 예제</h1>
      <ul>
        <li>
          <a href="./blog/">
            <strong>작은 기록 →</strong>
            <span>글, 방명록, 글쓰기가 있는 블로그</span>
          </a>
        </li>
        <li>
          <a href="https://github.com/naru-pub/example">
            <strong>소스 코드 →</strong>
            <span>GitHub Actions로 나루에 배포합니다</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
