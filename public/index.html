<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naru Example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf7;
        color: #18181b;
      }
      main {
        width: min(720px, calc(100vw - 48px));
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.4rem, 9vw, 6rem);
        line-height: 0.95;
      }
      p {
        margin: 0 0 16px;
        max-width: 40rem;
        font-size: 1.125rem;
        line-height: 1.75;
      }
      a {
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #171717;
          color: #fafafa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Naru Example</h1>
      <p>
        This page is deployed from GitHub Actions using
        <a href="https://github.com/naru-pub/actions">naru-pub/actions</a>.
      </p>
      <p>
        <a href="./blog/">작은 기록</a> is the Naru Data example blog: posts,
        a guestbook, and an owner-only editor, built with the
        <a href="https://naru.pub/docs/database">Naru Data SDK</a>.
      </p>
    </main>
  </body>
</html>
